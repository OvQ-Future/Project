services:
  - type: web
    name: developer-space
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_KEY
        sync: false
    disk:
      name: developer-space-data
      mountPath: /app/data
      sizeGB: 1
