<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d12">
  <meta name="description" content="一位开发者的个人空间：项目、动态与创作轨迹。">
  <title>开发者空间 · 项目与创作轨迹</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0d12'/%3E%3Cpath d='M18 20h20a8 8 0 0 1 0 16H27l13 8' stroke='%23b8f36a' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/developer" aria-label="开发者空间首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M7 8h12a5 5 0 0 1 0 10h-7l10 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-copy">DEV<span>/</span>SPACE</span>
      </a>

      <nav class="top-nav" aria-label="主要导航">
        <a href="/developer" class="nav-link" data-nav="developer">开发者</a>
        <a href="/projects" class="nav-link" data-nav="projects">项目</a>
      </nav>

      <div class="header-actions" id="auth-actions" aria-live="polite">
        <span class="auth-loading">读取状态中…</span>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="page-loading" role="status">
      <span class="loading-orbit" aria-hidden="true"></span>
      <span>正在加载开发者空间</span>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© <span id="footer-year"></span> Developer Space</span>
      <span class="footer-note">Built with intent · 仅作者可编辑</span>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <script src="/app.js" defer></script>
</body>
</html>
